<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Penjualan - Toko Bp. Aman</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f8; color: #333; max-width: 500px; margin: 0 auto; padding: 12px; padding-bottom: 30px; }
        
        .header { background: #128C7E; color: white; padding: 14px; border-radius: 10px; text-align: center; margin-bottom: 12px; }
        .header h2 { font-size: 18px; margin-bottom: 4px; }
        .status-koneksi { font-size: 11px; background: rgba(255,255,255,0.2); display: inline-block; padding: 2px 8px; border-radius: 10px; }

        .kartu { background: white; border-radius: 10px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .judul-bagian { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #128C7E; display: flex; justify-content: space-between; align-items: center; }

        /* PERIODE LAPORAN */
        .periode-wrapper { display: flex; gap: 6px; margin-bottom: 10px; }
        .btn-periode { flex: 1; padding: 6px; border: 1px solid #128C7E; background: white; color: #128C7E; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-periode.aktif { background: #128C7E; color: white; }

        .angka-laporan { display: flex; gap: 8px; text-align: center; }
        .box-angka { flex: 1; background: #f8f9fa; padding: 8px; border-radius: 8px; border: 1px solid #eee; }
        .box-angka .label { font-size: 11px; color: #666; margin-bottom: 2px; }
        .box-angka .val { font-size: 15px; font-weight: bold; }
        .val.omzet { color: #28a745; }
        .val.untung { color: #ff9800; }

        /* RIWAYAT TRANSAKSI */
        .riwayat-item { background: #fff; border: 1px solid #e0e0e0; border-left: 4px solid #128C7E; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 12px; }
        .riwayat-top { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; }
        .tag-jenis { background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .riwayat-tgl { font-size: 11px; color: #777; margin-bottom: 6px; }
        .riwayat-detail { background: #f8f9fa; padding: 6px; border-radius: 6px; margin: 6px 0; color: #444; }

        /* TOMBOL AKSI */
        .grup-tombol-item { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #eee; }
        .btn-cetak { background: #128C7E; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .btn-hapus-satuan { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .btn-hapus-semua { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }

        .btn-muat { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 5px; }
        .btn-suara { background: #ff9800; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }

        @media print {
            body * { visibility: hidden; }
            #areaStruk, #areaStruk * { visibility: visible; }
            #areaStruk { position: absolute; left: 0; top: 0; width: 100%; font-family: monospace; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h2>📊 PANEL PENJUALAN TOKO</h2>
    <span class="status-koneksi" id="statusCek">⏳ Menghubungkan...</span>
</div>

<div class="kartu">
    <div class="judul-bagian">
        <span>LAPORAN PENJUALAN</span>
        <button class="btn-suara" onclick="aktifkanAudio()">🔔 Tes Suara</button>
    </div>
    <div class="periode-wrapper">
        <button class="btn-periode aktif" onclick="gantiPeriode('hari', this)">Hari Ini</button>
        <button class="btn-periode" onclick="gantiPeriode('minggu', this)">7 Hari</button>
        <button class="btn-periode" onclick="gantiPeriode('bulan', this)">30 Hari</button>
    </div>
    <div class="angka-laporan">
        <div class="box-angka">
            <div class="label">Total Omzet</div>
            <div class="val omzet" id="lapOmzet">Rp 0</div>
        </div>
        <div class="box-angka">
            <div class="label">Total Laba</div>
            <div class="val untung" id="lapUntung">Rp 0</div>
        </div>
        <div class="box-angka">
            <div class="label">Transaksi</div>
            <div class="val" id="lapJumlah">0</div>
        </div>
    </div>
</div>

<div class="kartu">
    <div class="judul-bagian">
        <span>RIWAYAT TRANSAKSI</span>
        <div>
            <button class="btn-hapus-semua" onclick="konfirmasiHapusSemua()">🗑️ Hapus Semua</button>
        </div>
    </div>
    <div id="daftarRiwayat"></div>
    <button class="btn-muat" id="btnMuatLagi" onclick="muatLebihBanyak()" style="display:none;">MUAT LEBIH BANYAK...</button>
</div>

<div id="areaStruk" style="display:none;"></div>

<script>
const URL_PENYIMPANAN = "https://script.google.com/macros/s/AKfycbwTQEolvUobuRORHvYgF32FtTewxQBHyfbcIIiXK-QSeRhmhiPSQQ9JprGlENv2mKTz/exec";

let riwayatData = [];
let periodeAktif = 'hari';
let tampilSampai = 10;
let jumlahSebelumnya = 0;

function bunyikanNotifikasi() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = 880;
        gain.gain.value = 0.3;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => osc.stop(), 500);
    } catch(e) {}
}

function aktifkanAudio() {
    bunyikanNotifikasi();
    alert("Notifikasi suara aktif!");
}

async function muatData() {
    const statusEl = document.getElementById('statusCek');
    try {
        const res = await fetch(URL_PENYIMPANAN + "?aksi=ambilRiwayat", { cache: 'no-store' });
        const json = await res.json();
        const dataBaru = Array.isArray(json) ? json : (json.data || []);

        if (jumlahSebelumnya > 0 && dataBaru.length > jumlahSebelumnya) {
            bunyikanNotifikasi();
            // Jika berjalan di APK Android
            if (typeof AndroidPanel !== 'undefined' && AndroidPanel.bunyikanNotifikasiBaru) {
                AndroidPanel.bunyikanNotifikasiBaru(dataBaru[0].namaPelanggan || "Pelanggan", "Rp " + (dataBaru[0].total||0).toLocaleString('id-ID'));
            }
        }
        
        jumlahSebelumnya = dataBaru.length;
        riwayatData = dataBaru;

        statusEl.textContent = "🟢 Terhubung (" + new Date().toLocaleTimeString('id-ID') + ")";
        statusEl.style.background = "rgba(40,167,69,0.3)";

        renderLaporan();
        renderRiwayat();
    } catch (e) {
        statusEl.textContent = "🔴 Gagal Memuat Data";
        statusEl.style.background = "rgba(220,53,69,0.3)";
    }
}

function renderLaporan() {
    let skrg = new Date(), batas = new Date();
    if (periodeAktif === 'hari') batas = new Date(skrg.getFullYear(), skrg.getMonth(), skrg.getDate());
    else if (periodeAktif === 'minggu') batas.setDate(skrg.getDate() - 7);
    else batas.setDate(skrg.getDate() - 30);

    let filter = riwayatData.filter(r => {
        const tgl = r.tanggalSimpan ? new Date(r.tanggalSimpan) : null;
        return tgl && !isNaN(tgl.getTime()) && tgl >= batas;
    });

    const omzet = filter.reduce((sum, r) => sum + (Number(r.total) || 0), 0);
    const untung = filter.reduce((sum, r) => sum + (Number(r.untung) || 0), 0);

    document.getElementById('lapOmzet').textContent = "Rp " + omzet.toLocaleString('id-ID');
    document.getElementById('lapUntung').textContent = "Rp " + untung.toLocaleString('id-ID');
    document.getElementById('lapJumlah').textContent = filter.length;
}

function gantiPeriode(p, btn) {
    periodeAktif = p;
    document.querySelectorAll('.btn-periode').forEach(b => b.classList.remove('aktif'));
    btn.classList.add('aktif');
    renderLaporan();
}

function renderRiwayat() {
    const wadah = document.getElementById('daftarRiwayat');
    const btnMuat = document.getElementById('btnMuatLagi');

    if (riwayatData.length === 0) {
        wadah.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">Belum ada riwayat transaksi.</p>';
        btnMuat.style.display = 'none';
        return;
    }

    const itemTampil = riwayatData.slice(0, tampilSampai);
    wadah.innerHTML = itemTampil.map((p) => {
        const jenis = (p.jenis || "PESANAN").toUpperCase();
        const nama = p.namaPelanggan || "Pelanggan";
        const barisKe = p.barisKe || p.barisAsliDiSheet;
        const barangTeks = Array.isArray(p.barang) 
            ? p.barang.map(b => `• ${b.nama} (${b.jumlah}x)`).join('<br>') 
            : "";

        return `
            <div class="riwayat-item">
                <div class="riwayat-top">
                    <span>${nama}</span>
                    <span class="tag-jenis">${jenis}</span>
                </div>
                <div class="riwayat-tgl">📅 ${p.tanggal || '-'}</div>
                <div style="color:#666; font-size:11px;">📍 ${p.infoTambahan || '-'}</div>
                <div class="riwayat-detail">${barangTeks}</div>
                <div style="display:flex; justify-content:space-between; margin-top:4px;">
                    <b>Total: Rp ${(p.total||0).toLocaleString('id-ID')}</b>
                    <span style="color:#ff9800; font-weight:bold;">Laba: Rp ${(p.untung||0).toLocaleString('id-ID')}</span>
                </div>
                <div class="grup-tombol-item">
                    <button class="btn-hapus-satuan" onclick="hapusRiwayatSatuan(${barisKe}, '${nama}')">🗑️ Hapus</button>
                    <button class="btn-cetak" onclick="cetakStruk(${barisKe})">🖨️ Cetak Struk</button>
                </div>
            </div>
        `;
    }).join('');

    btnMuat.style.display = tampilSampai < riwayatData.length ? 'block' : 'none';
}

function muatLebihBanyak() {
    tampilSampai += 10;
    renderRiwayat();
}

// === FUNGSI HAPUS SATUAN (BARIS TERPILIH) ===
async function hapusRiwayatSatuan(barisKe, nama) {
    const yakin = confirm(`Yakin ingin menghapus riwayat pesanan dari "${nama}"?`);
    if (!yakin) return;

    document.getElementById('statusCek').textContent = "⏳ Menghapus...";

    try {
        await fetch(URL_PENYIMPANAN, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ aksi: "hapusRiwayat", data: { barisKe: barisKe } })
        });

        alert("Riwayat pesanan berhasil dihapus!");
        muatData();
    } catch (e) {
        alert("Gagal menghapus riwayat!");
    }
}

// === FUNGSI CETAK STRUK ===
function cetakStruk(barisKe) {
    const p = riwayatData.find(item => (item.barisKe || item.barisAsliDiSheet) === barisKe);
    if (!p) return;

    let rincianBarang = "";
    if (Array.isArray(p.barang)) {
        p.barang.forEach(b => {
            rincianBarang += `${b.nama}\n  ${b.jumlah} x Rp ${(b.harga||0).toLocaleString('id-ID')} = Rp ${(b.subtotal||0).toLocaleString('id-ID')}\n`;
        });
    }

    const teksStruk = `
================================
        TOKO BP. AMAN
================================
Waktu : ${p.tanggal || '-'}
Nama  : ${p.namaPelanggan || '-'}
Alamat: ${p.infoTambahan || '-'}
--------------------------------
${rincianBarang}--------------------------------
TOTAL BAYAR : Rp ${(p.total||0).toLocaleString('id-ID')}
================================
  Terima Kasih Atas Pesanannya!
================================
\n\n\n`;

    // Jika dipanggil dari APK Android Studio
    if (typeof AndroidPanel !== 'undefined' && AndroidPanel.cetakBluetooth) {
        AndroidPanel.cetakBluetooth(teksStruk);
        return;
    }

    // Jika lewat Browser Biasa
    const areaStruk = document.getElementById('areaStruk');
    areaStruk.style.display = 'block';
    areaStruk.innerHTML = `<pre>${teksStruk}</pre>`;
    window.print();

    setTimeout(() => { areaStruk.style.display = 'none'; }, 1000);
}

// === FUNGSI HAPUS SEMUA RIWAYAT ===
async function konfirmasiHapusSemua() {
    if (riwayatData.length === 0) {
        alert("Riwayat transaksi masih kosong!");
        return;
    }

    const yakin = confirm("⚠️ YAKIN HAPUS SEMUA RIWAYAT TRANSAKSI?\n\nData yang dihapus dari Google Sheets tidak bisa dikembalikan lagi.");
    if (!yakin) return;

    document.getElementById('statusCek').textContent = "⏳ Menghapus...";

    try {
        await fetch(URL_PENYIMPANAN, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ aksi: "hapusSemuaRiwayat" })
        });

        alert("Semua riwayat transaksi berhasil dihapus!");
        riwayatData = [];
        jumlahSebelumnya = 0;
        renderLaporan();
        renderRiwayat();
        muatData();
    } catch (e) {
        alert("Gagal menghapus riwayat!");
    }
}

setInterval(muatData, 10000);
window.onload = muatData;
</script>

</body>
</html>
